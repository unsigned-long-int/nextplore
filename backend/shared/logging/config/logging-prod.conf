[loggers]
keys=root

[handlers]
keys=consoleHandler

[formatters]
keys=jsonFormatter

[logger_root]
level=INFO
handlers=consoleHandler

[handler_consoleHandler]
class=StreamHandler
level=NOTSET
formatter=jsonFormatter
args=(sys.stdout,)

[formatter_jsonFormatter]
class=shared.logging.CustomJsonFormatter
format=%(asctime)s %(name)s %(funcName)s %(levelname)s %(message)s
datefmt=%Y-%m-%dT%H:%M:%SZ