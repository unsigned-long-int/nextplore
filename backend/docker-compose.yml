version: "3.9"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    ports:
      - "${ZOOKEEPER_PORT:-2181}:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - app-network
  
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - app-network

  inspection_service:
    build:
      context: .
      dockerfile: microservices/integration_registry_inspection_service/Dockerfile
    container_name: inspection_service
    ports:
      - "${INSPECTION_PORT:-8001}:8001"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - PYTHONUNBUFFERED=1
      - FERNET_KEY=${FERNET_KEY}
      - KAFKA_GROUP_PREFIX=${KAFKA_GROUP_PREFIX}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    depends_on:
      - kafka
    restart: on-failure
    networks:
      - app-network

  vectorization_service:
    build:
      context: .
      dockerfile: microservices/vectorization_service/Dockerfile
    container_name: vectorization_service
    ports:
      - "${VECTORIZATION_PORT:-8002}:8001"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - PYTHONUNBUFFERED=1
      - KAFKA_GROUP_PREFIX=${KAFKA_GROUP_PREFIX}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - kafka
    restart: on-failure
    networks:
      - app-network

  vector_upsert_service:
    build:
      context: .
      dockerfile: microservices/vector_upsert_service/Dockerfile
    container_name: vector_upsert_service
    depends_on:
      - kafka
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - PYTHONUNBUFFERED=1
      - KAFKA_GROUP_PREFIX=${KAFKA_GROUP_PREFIX}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    restart: on-failure
    networks:
      - app-network

  orchestration_service:
    build:
      context: .
      dockerfile: nextplore-orchestrator/Dockerfile
    container_name: orchestration_service
    depends_on:
      - kafka
    ports:
      - "${ORCHESTRATION_PORT:-8003}:8001"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - PYTHONUNBUFFERED=1
      - KAFKA_GROUP_PREFIX=${KAFKA_GROUP_PREFIX}
      - FERNET_KEY=${FERNET_KEY}
      - VECTORIZATION_PORT=${VECTORIZATION_PORT}
      - INSPECTION_PORT=${INSPECTION_PORT}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      - ISSUER=${ISSUER}
      - JWKS_URL=${JWKS_URL}
      - JWT_ALGORITHMS=${JWT_ALGORITHMS}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    restart: on-failure
    networks:
      - app-network

networks:
  app-network:
    external: true
