version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: on-failure
    networks:
      - app-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    ports:
      - "${ZOOKEEPER_PORT:-2181}:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - app-network
  
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - app-network

  integration_service:
    build:
      context: .
      dockerfile: microservices/integration_service/Dockerfile
    container_name: integration_service
    ports:
      - "${INTEGRATION_PORT:-8001}:8001"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - PYTHONUNBUFFERED=1
      - REDIS_URL=${REDIS_URL}
      - FERNET_KEY=${FERNET_KEY}
      - KAFKA_GROUP_PREFIX=${KAFKA_GROUP_PREFIX}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    depends_on:
      - kafka
      - redis
    restart: on-failure
    networks:
      - app-network

  embedding_service:
    build:
      context: .
      dockerfile: microservices/embedding_service/Dockerfile
    container_name: embedding_service
    ports:
      - "${EMBEDDING_PORT:-8002}:8001"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - PYTHONUNBUFFERED=1
      - REDIS_URL=${REDIS_URL}
      - KAFKA_GROUP_PREFIX=${KAFKA_GROUP_PREFIX}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - kafka
      - redis
    restart: on-failure
    networks:
      - app-network

  vector_service:
    build:
      context: .
      dockerfile: microservices/vector_service/Dockerfile
    container_name: vector_service
    ports:
      - "${VECTOR_PORT:-8003}:8001"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - PYTHONUNBUFFERED=1
      - REDIS_URL=${REDIS_URL}
      - KAFKA_GROUP_PREFIX=${KAFKA_GROUP_PREFIX}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - QDRANT_CLUSTER_HOST=${QDRANT_CLUSTER_HOST}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
    depends_on:
      - kafka
      - redis
    restart: on-failure
    networks:
      - app-network

  ai_orm_context_service:
    build:
      context: .
      dockerfile: microservices/ai_orm_context_service/Dockerfile
    container_name: ai_orm_context_service
    depends_on:
      - redis
    ports:
      - "${AI_ORM_CONTEXT_PORT:-8004}:8001"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - REDIS_URL=${REDIS_URL}
    restart: on-failure
    networks:
      - app-network

  orchestration_service:
    build:
      context: .
      dockerfile: nextplore_orchestrator/Dockerfile
    container_name: orchestration_service
    depends_on:
      - kafka
      - redis
    ports:
      - "${ORCHESTRATION_PORT:-8005}:8001"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - PYTHONUNBUFFERED=1
      - KAFKA_GROUP_PREFIX=${KAFKA_GROUP_PREFIX}
      - FERNET_KEY=${FERNET_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      - ISSUER=${ISSUER}
      - JWKS_URL=${JWKS_URL}
      - JWT_ALGORITHMS=${JWT_ALGORITHMS}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    restart: on-failure
    networks:
      - app-network

networks:
  app-network:
    external: true
